[package]
name = "visualssh"
version = "0.2.0"
description = "VisualSSH — 让远程文件操作，像本地一样优雅"
authors = ["VisualSSH Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[lib]
# Tauri 2 约定：库 crate 供桌面与移动端入口共用
name = "visualssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# fs/io-util：传输中心的本地文件流式读写
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
# 剪贴板位图（CF_DIBV5/CF_DIB）→ PNG 编码（块 B；仅编码器，无全家桶解码器）
png = "0.17"
# 原生保存/打开对话框（M3 下载入口）
tauri-plugin-dialog = "2"
# 终端数据通道的事件负载编码（二进制 → JSON 安全字符串）
base64 = "0.22"
# 系统剪贴板文件列表（CF_HDROP，跨端 Ctrl+C/V 文件传递）
clipboard-win = "5"
# OLE 虚拟文件剪贴板（IDataObject + FILEDESCRIPTOR/FILECONTENTS，粘贴时才下载）
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# windows::core（implement 宏展开引用 windows_core 路径，需直接依赖）
windows-core = "0.62"
# 纯 Rust 实现的 SSH 协议栈，无 OpenSSL 依赖，天然跨平台
russh = "0.64"
russh-sftp = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
# 跨平台用户配置目录（known_hosts 等落到 %APPDATA%/visualssh）
dirs = "7"
# 凭据加密存储（Windows 凭据管理器 / DPAPI）；只启用 v1 API + Windows 后端
keyring = { version = "4", default-features = false, features = [
    "v1",
    "windows-native-keyring-store",
] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
