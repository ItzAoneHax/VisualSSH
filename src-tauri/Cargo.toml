[package]
name = "visualssh"
version = "0.1.0"
description = "VisualSSH — 让远程文件操作，像本地一样优雅"
authors = ["VisualSSH Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[lib]
# Tauri 2 约定：库 crate 供桌面与移动端入口共用
name = "visualssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# 纯 Rust 实现的 SSH 协议栈，无 OpenSSL 依赖，天然跨平台
russh = "0.64"
russh-sftp = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
